[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-age"
version = "0.1.0"
description = "List TODO/FIXME comments in a git repo, oldest first, with author and age"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "sndryu1" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/sndryu1/todo-age"

[project.scripts]
todo-age = "todo_age:main"

[tool.setuptools]
py-modules = ["todo_age"]
